<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block titre %}Données de santé{% endblock %}</title>
        <!-- Préfixe de l'application : vide en local, "/sae201_b1" en prod (pour les fetch JS) -->
        <script>window.APP_BASE = "{{ request.script_root }}";</script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>
    <body>
        <header>
            <h1>Données de santé libérale</h1>
            <nav>
                <a href="{{ url_for('accueil.afficher') }}" class="{{ 'actif' if request.endpoint == 'accueil.afficher' }}">Accueil</a>
                <a href="{{ url_for('prescriptions.afficher') }}" class="{{ 'actif' if request.endpoint == 'prescriptions.afficher' }}">Prescriptions</a>
                <a href="{{ url_for('comparaison.afficher') }}" class="{{ 'actif' if request.endpoint == 'comparaison.afficher' }}">Comparaison</a>
                <a href="{{ url_for('honoraires.afficher') }}" class="{{ 'actif' if request.endpoint == 'honoraires.afficher' }}">Honoraires</a>
                <a href="{{ url_for('dentistes.carte_dentistes') }}" class="{{ 'actif' if request.endpoint == 'dentistes.carte_dentistes' }}">Carte des densités</a>
                <a href="{{ url_for('auth.statistiques') }}" class="{{ 'actif' if request.endpoint and request.endpoint.startswith('auth.') }}">Admin</a>
            </nav>
        </header>
        <main>
            {% block contenu %}{% endblock %}
        </main>
        <footer>
            <p>SAE2.01 · BUT Informatique · Gimenez — De Sousa — Piscitello ·<img class="logo_footer" src="{{ url_for('static', filename='/upec-iutcv_info-color.png') }}" alt="Logo UPEC"></p>
            <p>Données issues de l'<a href="https://data.ameli.fr" target="_blank" rel="noopener">API Open Data de l'Assurance Maladie (data.ameli.fr)</a></p>
        </footer>
        </body>
</html>
